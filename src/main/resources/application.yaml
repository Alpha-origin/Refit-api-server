spring:
  application:
    name: Repit_api_server

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  task:
    execution:
      # applicationTaskExecutor 자동설정을 살려둔다.
      #
      # Boot는 그 빈을 @ConditionalOnMissingBean(Executor.class) 또는 이 값이 force일 때만 만든다.
      # 이 앱에는 Executor 타입 빈이 하나도 없어서 자동설정이 늘 걸렸는데, SSE ping용
      # ThreadPoolTaskExecutor를 등록하면서 조건이 깨졌다. 그대로 두면 MVC async가
      # SimpleAsyncTaskExecutor 폴백으로 내려가고 아래 pool 설정이 조용히 무의미해진다.
      #
      # 지금은 @Async도 Callable/StreamingResponseBody/DeferredResult 반환도 없어 당장 깨지는 것은
      # 없다. 나중에 @Async 하나가 붙는 순간 호출마다 새 스레드가 뜨는데, 그때 원인을 여기까지
      # 되짚기는 어렵다. 한 줄로 막아둔다.
      mode: force
    scheduling:
      pool:
        # @Scheduled 작업이 나눠 쓰는 스레드 수. 정하지 않으면 1이라 모든 주기 작업이 한 줄로 선다.
        # SSE 하트비트(15초)는 구독마다 블로킹 write라, 응답하지 않는 클라이언트 하나가 송신 버퍼를
        # 채우면 그 자리에서 멈춘다. 스레드가 하나면 그 대기에 면접 준비 sweep(30초)까지 밀려,
        # 시간이 지난 준비 건의 실패가 제때 나가지 않는다. 예외는 삼키고 있지만 느린 소켓은
        # 예외가 아니라 대기라 그 방어에 걸리지 않는다.
        size: 4

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    # show-sql은 System.out으로 직접 찍혀 추적 id도 레벨도 붙지 않는다.
    # 아래 logging.level.org.hibernate.SQL로 로거를 태워 다른 로그와 같은 흐름에서 읽는다.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  cloud:
    aws:
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}
      s3:
        bucket: ${S3_BUCKET}
        base-url: ${S3_URL}
      region:
        static: ${AWS_REGION}

auth-server:
  base-url: ${AUTH_SERVER}

ai-server:
  base-url: ${AI_SERVER}
  # 분석 접수 응답이 콜백보다 늦게 오는 일이 있다. 여기서 끊기면 jobId를 받지 못해
  # 접수가 통째로 날아가고, 소유자가 붙지 않은 분석은 면접을 열 수 없다.
  read-timeout: 60s

chat-server:
  base-url: ${CHAT_SERVER}

external-api:
  connect-timeout: 3s
  read-timeout: 5s

app:
  internal-auth:
    # 분석·채팅 서버가 콜백에 X-Internal-Token 헤더로 실어 보내는 값.
    # 비어 있으면 콜백을 인증 없이 받는다. 부르는 쪽이 헤더를 보내도록 배포한 뒤에 채워 강제한다.
    token: ${INTERNAL_AUTH_TOKEN:}
  callback-base-url: ${CALLBACK_BASE_URL:https://wildcat-startle-rope.ngrok-free.dev}
  feedback:
    # 이 시간을 넘도록 분석 서버 콜백이 오지 않으면 실패로 처리하고 재요청을 허용한다.
    pending-timeout: 10m
  question-tailor:
    # 면접 시작 직전에 도는 작업이라 오래 기다릴 수 없다. 넘기면 원질문으로 면접을 연다.
    pending-timeout: 2m
    # 시간이 지난 준비 건을 훑는 간격. 폴링하지 않는 클라이언트에게도 이 주기로 실패가 나간다.
    sweep-interval: 30s
  sse:
    # 구독에 빈 줄을 흘려보내는 간격(ms). 이보다 오래 조용하면 중간의 프록시가 연결을 끊는다.
    heartbeat-interval-ms: 15000
    # 구독에 쓰는 일은 블로킹이다. 받는 쪽이 읽지 않으면 그 write는 소켓 타임아웃까지 멈춰 있고
    # 인터럽트로 깨울 수도 없다. 이 수만큼은 동시에 막혀 있어도 나머지 구독이 ping을 받는다.
    ping-pool-size: 8
    # 구독마다 ping을 하나까지만 띄우므로 쌓이는 작업은 구독 수를 넘지 않는다. 한계를 두는 것은
    # 넘쳤을 때 조용히 쌓이는 대신 거절로 드러나게 하기 위해서다. 거절된 ping은 다음 틱에 다시 나간다.
    ping-queue-capacity: 2000
  http-logging:
    enabled: true
    # 본문까지 남긴다. 끄면 요청선과 상태 코드, 소요 시간만 남는다.
    include-body: true
    # 본문 한 건에서 남길 최대 글자 수. 넘치면 잘라내고 원본 크기를 덧붙인다.
    max-body-length: 2000
    exclude-path-patterns:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /favicon.ico

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    # 어떤 쿼리가 나갔는지까지 흐름에 포함시킨다.
    #
    # 기본값을 info로 둬 운영에서는 꺼진다. 켜두면 쿼리마다 문장을 조립해 기록하는데,
    # 그 비용을 읽는 사람이 없는 곳에서까지 낼 이유가 없다. 로그 양이 늘어 정작 봐야 할
    # 줄이 묻히는 것도 같은 이유로 손해다.
    #
    # 흐름을 좇아야 할 때 SQL_LOG_LEVEL=debug로 켠다.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
    # 쿼리에 실제로 바인딩된 값까지 보려면 아래 주석을 푼다. 개인정보가 그대로 찍히니 운영에서는 끈다.
    # org.hibernate.orm.jdbc.bind: trace
